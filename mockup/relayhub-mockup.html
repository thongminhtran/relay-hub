<title>RelayHub Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Layout: switchboard. Public landing page first, then an app shell (nav rail, inbox list, message detail) with a pipeline strip that lights up as each message moves through Azure. */
  --bg:#F3F6FA;
  --surface:#FFFFFF;
  --surface-2:#EAF0F6;
  --line:#D7DFEA;
  --line-strong:#B8C4D3;
  --ink:#0D1626;
  --muted:#556276;
  --faint:#7F8CA0;
  --accent:#1260CC;
  --accent-ink:#FFFFFF;
  --accent-soft:#E1EBFA;
  --fresh:rgba(18,96,204,.20);
  --data:#B0620A;
  --ok:#147545; --ok-soft:#DDF2E5;
  --warn:#975700; --warn-soft:#FFEFD1;
  --bad:#BE3226; --bad-soft:#FBE4E1;
  --ig:#C42E6B; --fb:#1A6BDB; --wa:#13834A; --form:#0D7880; --stripe:#5A50E0;
  --on-chan:#FFFFFF;
  --shadow:0 1px 2px rgba(13,22,38,.06),0 10px 28px rgba(13,22,38,.07);
  --tour-bg:#0D1626; --tour-ink:#E6EDF7; --tour-muted:#98A7BD; --tour-line:#2A3A54; --tour-accent:#8AB8FF; --tour-ok:#2E9E63;
  --chat-bg:#2B2D31; --chat-panel:#1F2023; --chat-ink:#E3E5E8; --chat-muted:#9BA1AB; --chat-bot:#5865F2;
  --code-bg:#0F1828; --code-line:#22314A; --code-ink:#D5E1F1; --code-key:#8CC4FF; --code-str:#9FE0B4; --code-num:#F5C27A; --code-mute:#7F8DA3; --code-err:#FF8E85;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r-sm:6px; --r:10px; --r-lg:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1019; --surface:#111A27; --surface-2:#172235; --line:#223047; --line-strong:#34455F;
    --ink:#E6ECF5; --muted:#9AA8BC; --faint:#7686A0;
    --accent:#6AA6FF; --accent-ink:#071222; --accent-soft:#14284A; --fresh:rgba(106,166,255,.22);
    --data:#F2A649; --ok:#52CC8E; --ok-soft:#0F2E1E; --warn:#F2B54E; --warn-soft:#33260E; --bad:#FF7D72; --bad-soft:#3A1613;
    --ig:#D93C7B; --fb:#2F7BEA; --wa:#1E9A57; --form:#15919A; --stripe:#6E66F2;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    --tour-bg:#16233A; --tour-line:#2C3D5C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1019; --surface:#111A27; --surface-2:#172235; --line:#223047; --line-strong:#34455F;
  --ink:#E6ECF5; --muted:#9AA8BC; --faint:#7686A0;
  --accent:#6AA6FF; --accent-ink:#071222; --accent-soft:#14284A; --fresh:rgba(106,166,255,.22);
  --data:#F2A649; --ok:#52CC8E; --ok-soft:#0F2E1E; --warn:#F2B54E; --warn-soft:#33260E; --bad:#FF7D72; --bad-soft:#3A1613;
  --ig:#D93C7B; --fb:#2F7BEA; --wa:#1E9A57; --form:#15919A; --stripe:#6E66F2;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  --tour-bg:#16233A; --tour-line:#2C3D5C;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:400 14.5px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
code,.mono{font-family:var(--f-mono);font-size:.86em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.bad-c{color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.logo{width:26px;height:26px;color:var(--accent);flex:none}
.h2{font:700 18px/1.2 var(--f-display);letter-spacing:-.01em}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);padding:8px 14px;font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap;transition:background-color .15s,border-color .15s,filter .15s}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent);filter:brightness(1.1)}
.btn-quiet{border-color:transparent;background:transparent}
.btn-sm{padding:5px 10px;font-size:13px}
.btn-lg{padding:12px 20px;font-size:15.5px}
.btn:disabled{opacity:.5}
.btn .i{width:15px;height:15px}

/* channel glyphs and pills */
.glyph{flex:none;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font:700 10.5px/1 var(--f-mono);letter-spacing:.02em;color:var(--on-chan)}
.g-instagram{background:var(--ig)}.g-facebook{background:var(--fb)}.g-whatsapp{background:var(--wa)}.g-form{background:var(--form)}.g-stripe{background:var(--stripe)}
.g-add{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line-strong);font-size:15px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.4}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill-ok{background:var(--ok-soft);color:var(--ok)}
.pill-warn{background:var(--warn-soft);color:var(--warn)}
.pill-bad{background:var(--bad-soft);color:var(--bad)}
.pill-info{background:var(--accent-soft);color:var(--accent)}
.pill-mute{background:var(--surface-2);color:var(--muted)}

/* mockup tour bar */
.tour{background:var(--tour-bg);color:var(--tour-ink);padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;font-size:13px}
.tour-label{font:600 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tour-muted)}
.tour-steps{display:flex;flex-wrap:wrap;gap:6px}
.tour-step{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--tour-line);background:transparent;color:var(--tour-muted);border-radius:999px;padding:3px 11px 3px 4px;font-size:12.5px;font-weight:500}
.tour-step:hover{border-color:var(--tour-accent);color:var(--tour-ink)}
.tour-step .n{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font:600 11px/1 var(--f-mono);background:var(--tour-line);color:var(--tour-ink)}
.tour-step .n .i{width:12px;height:12px;stroke-width:3}
.tour-step.is-done{color:var(--tour-ink)}
.tour-step.is-done .n{background:var(--tour-ok);color:var(--on-chan)}
.tour-step.is-current{color:var(--tour-ink);border-color:var(--tour-accent)}
.tour-step.is-current .n{background:var(--tour-accent);color:var(--tour-bg)}
.tour-hint{flex:1 1 300px;min-width:0;color:var(--tour-ink);line-height:1.45}
.tour-hint b{color:var(--tour-accent);font-weight:600}
.tour-btn{border:1px solid var(--tour-line);background:transparent;color:var(--tour-ink);border-radius:6px;padding:4px 10px;font-size:12.5px}
.tour-btn:hover{border-color:var(--tour-accent)}
.tour-meta{color:var(--tour-muted);font-size:12.5px}

/* landing */
.landing{max-width:1160px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}
.l-nav{display:flex;align-items:center;gap:12px 20px;padding-block:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font:700 20px/1 var(--f-display);letter-spacing:-.01em;color:var(--ink)}
.l-links{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.l-links button{background:none;border:0;padding:6px 10px;border-radius:6px;color:var(--muted);font-weight:500}
.l-links button:hover{color:var(--ink);background:var(--surface-2)}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(28px,5vw,64px);align-items:center;padding-block:clamp(24px,5vw,64px) clamp(40px,6vw,80px)}
.eyebrow{font:600 12px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.hero h1{font:700 clamp(34px,5.2vw,58px)/1.03 var(--f-display);letter-spacing:-.028em;margin-top:16px}
.lede{font-size:clamp(16px,1.6vw,18px);color:var(--muted);max-width:56ch;margin-top:18px;line-height:1.6}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.hero-note{margin-top:14px;font-size:13px;color:var(--faint)}
.live-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;min-width:0}
.live-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px}
.live-dot{display:inline-flex;align-items:center;gap:7px;color:var(--ok);font-weight:600;font-size:12px}
.live-dot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 var(--ok-soft)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.live-rows{padding-block:4px}
.live-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 16px}
.live-row + .live-row{border-top:1px solid var(--line)}
.live-row .glyph{grid-row:1/3}
.live-row .nm{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-row .tm{font-size:12px;color:var(--faint);white-space:nowrap}
.live-row .tx{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-row .rt{display:inline-flex;align-items:center;gap:4px;font:500 11.5px var(--f-mono);color:var(--ok);white-space:nowrap}
.live-row .rt .i{width:13px;height:13px;stroke-width:2.6}
.live-row.enter{animation:rowin .55s ease-out}
@keyframes rowin{from{opacity:0;transform:translateY(-6px);background:var(--fresh)}to{opacity:1;transform:none}}
.live-foot{border-top:1px solid var(--line);padding:10px 16px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 16px;background:var(--surface-2)}
.l-sec{padding-block:clamp(44px,6vw,72px);border-top:1px solid var(--line)}
.l-sec h2{font:700 clamp(25px,3vw,34px)/1.12 var(--f-display);letter-spacing:-.018em;max-width:26ch;margin-top:10px}
.l-sec .sub{color:var(--muted);margin-top:12px;max-width:64ch;font-size:16px;line-height:1.6}
.l-pipe{margin-top:28px}
.l-pipe .node{padding:14px}
.l-pipe .desc{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.5}
.feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:28px}
.feat article{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.feat .tag{display:block;font:600 11.5px var(--f-mono);color:var(--accent);margin-bottom:10px}
.feat h3{font:700 18px/1.2 var(--f-display)}
.feat p{color:var(--muted);margin-top:6px;font-size:14px;line-height:1.55}
.stack{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;margin-top:28px}
.stack h3{font:600 11.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.stack ul{display:flex;flex-wrap:wrap;gap:6px}
.stack li{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 9px;font-size:13px;font-weight:500}
.stack-note{margin-top:22px;color:var(--muted);font-size:14px}
.cta-band{margin-block:8px 36px;background:var(--ink);color:var(--bg);border-radius:var(--r-lg);padding:clamp(24px,4vw,40px);display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.cta-band h2{font:700 clamp(22px,3vw,30px)/1.15 var(--f-display);letter-spacing:-.015em}
.cta-band p{opacity:.75;margin-top:6px}
.l-foot{padding-block:22px 32px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:space-between}

/* pipeline (landing + app) */
.pipe{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.node{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0;transition:border-color .25s,background-color .25s,box-shadow .25s}
.node:not(:last-child)::after{content:"";position:absolute;top:50%;right:-13px;width:12px;height:2px;background:var(--line-strong)}
.node .k{display:block;font:600 10.5px/1 var(--f-mono);color:var(--faint);letter-spacing:.07em;text-transform:uppercase}
.node .nm{display:block;font-weight:700;font-size:14.5px;margin-top:7px}
.node .svc{display:block;font-size:12px;color:var(--muted);line-height:1.35;margin-top:2px}
.node .note{display:block;font:500 11.5px/1.4 var(--f-mono);margin-top:8px;color:var(--muted);min-height:1.4em;overflow-wrap:anywhere}
.node.is-active{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--fresh)}
.node.is-active .k,.node.is-done .k,.node.is-active .note,.node.is-done .note{color:var(--accent)}
.node.is-done{border-color:var(--accent)}
.node.is-done:not(:last-child)::after,.node.is-active:not(:last-child)::after{background:var(--accent)}
.node.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.node.is-ok .k,.node.is-ok .note{color:var(--ok)}
.node.is-wait{border-color:var(--warn);background:var(--warn-soft)}
.node.is-wait .k,.node.is-wait .note{color:var(--warn)}
.node.is-fail{border-color:var(--bad);background:var(--bad-soft)}
.node.is-fail .k,.node.is-fail .note{color:var(--bad)}

/* waking screen */
.wake{min-height:62vh;display:grid;place-items:center;padding-block:40px;padding-inline:16px}
.wake-card{width:min(540px,100%);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:26px;display:flex;flex-direction:column;gap:10px}
.wake-card h1{font:700 24px/1.15 var(--f-display);letter-spacing:-.015em}
.wake-card .muted{font-size:14px}
.wake-steps{margin:10px 0 4px;display:flex;flex-direction:column;gap:12px}
.wk{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:12px;align-items:center;color:var(--faint)}
.wk b{display:block;font-weight:600;font-size:14px}
.wk small{display:block;font:12px var(--f-mono);overflow-wrap:anywhere}
.wk .ic{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center}
.wk .ic .i{width:12px;height:12px;stroke-width:3;opacity:0}
.wk.is-active{color:var(--ink)}
.wk.is-active .ic{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.wk.is-done{color:var(--ink)}
.wk.is-done .ic{background:var(--ok);border-color:var(--ok);color:var(--on-chan)}
.wk.is-done .ic .i{opacity:1}
.wk .t{font:500 12px var(--f-mono);color:var(--ok)}
@keyframes spin{to{transform:rotate(360deg)}}
.wake-card .btn{align-self:flex-start}

/* app shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);align-items:start}
.rail{position:sticky;top:0;min-height:100vh;background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:18px}
.ws{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface-2)}
.ws b{display:block;font-size:13.5px}
.ws span{display:block;font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:var(--r-sm);color:var(--muted);font-weight:500;font-size:14px;text-align:left}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .count{margin-left:auto;font:600 11.5px var(--f-mono);color:var(--faint)}
.nav .count.bad{background:var(--bad);color:var(--on-chan);border-radius:999px;padding:1px 7px}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.who{display:flex;gap:10px;align-items:center;font-size:13px}
.who b{display:block;font-weight:600}
.who span{display:block;color:var(--muted);font-size:12px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font:600 11px var(--f-mono);flex:none}
.rail-btns{display:flex;gap:6px;flex-wrap:wrap}
.main{min-width:0;padding:22px clamp(16px,2.4vw,32px) 48px;display:flex;flex-direction:column;gap:16px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.page-head h1{font:700 27px/1.1 var(--f-display);letter-spacing:-.018em}
.page-head .desc{color:var(--muted);margin-top:6px;max-width:70ch}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ok);font-weight:600;margin-top:6px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);animation:ping 2s infinite}
.search{flex:0 1 320px;min-width:0}
.input{width:100%;min-width:0;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-sm);padding:8px 11px;font-size:14px}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{display:inline-flex;align-items:baseline;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:13px;color:var(--muted)}
.stat b{font:600 14.5px var(--f-mono);color:var(--ink)}
.stat.ok b{color:var(--ok)}.stat.warn b{color:var(--warn)}.stat.bad b{color:var(--bad)}

/* simulator */
.sim{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,330px);gap:16px}
.sim-ctrl{display:flex;flex-direction:column;gap:14px;min-width:0}
.sim-head h2{font:700 17px/1.2 var(--f-display)}
.sim-head p{color:var(--muted);font-size:13px;margin-top:3px;max-width:70ch}
.sim-btns{display:flex;flex-wrap:wrap;gap:8px}
.sim-btn{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:5px 14px 5px 5px;font-weight:600;font-size:13.5px}
.sim-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.sim-btn .glyph{width:26px;height:26px}
.own label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:6px}
.own-row{display:flex;gap:8px}
.field-err{color:var(--bad);font-size:12.5px;margin-top:6px}
.switch{display:flex;align-items:flex-start;gap:11px;cursor:pointer;padding:10px 12px;border:1px dashed var(--line-strong);border-radius:var(--r);transition:background-color .2s,border-color .2s}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{flex:none;width:38px;height:22px;border-radius:999px;background:var(--line-strong);position:relative;transition:background-color .2s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .2s}
.switch input:checked + .track{background:var(--bad)}
.switch input:checked + .track::after{transform:translateX(16px)}

function extId(ch) {
  return { instagram: 'aWdfZAG' + hex(22), facebook: 'm_' + hex(24), whatsapp: 'wamid.HBgL' + hex(24).toUpperCase(), form: uuid(), stripe: 'evt_3Q' + hex(20) }[ch];
}
function makeEvent(channel, from, text, at) {

    id: nextEventId++, channel, from, text, receivedAt: at, insertedAt: 0,
    correlationId: hex(12), traceId: hex(32), spanId: hex(16), sig: hex(64), externalId: extId(channel),
    trace: { api: rnd(9, 21), q1: rnd(70, 190), fn: rnd(55, 105), sql: rnd(7, 16), sr: rnd(5, 12), q2: rnd(35, 95) },
    deliveries: [], replies: [],

  ev.deliveries = ROUTES[channel].map(dest => ({ id: nextDeliveryId++, dest, status: 'Pending', attempts: [], nextAt: null, lastError: null, replayed: false, runStart: 0 }));
  return ev;
}
function seed() {
  state.epoch++;
  nextEventId = 1031; nextDeliveryId = 2201;
  state.events = []; state.discord = []; state.replayLog = []; state.pipe = null; state.drafts = {};
  const now = Date.now();
  for (const [ch, name, handle, text, mins, special] of SEED) {
    const t = now - mins * 60000;
    const ev = makeEvent(ch, { name, handle }, text, t);
    for (const d of ev.deliveries) {
      const dest = DEST[d.dest];
      if (special === 'email-dead' && d.dest === 'email') {
        let at = t + 600;
        [0, 2, 4, 8].forEach((gap, i) => { at += gap * 1000 + (i ? 400 : 0); d.attempts.push({ no: i + 1, at, ms: rnd(180, 320), http: 503, error: '503 Service Unavailable' }); });
        d.status = 'DeadLettered'; d.lastError = '503 Service Unavailable';
      } else {
        const at = t + rnd(450, 800);

        d.status = 'Delivered';
        if (dest.kind === 'discord') state.discord.unshift({ ev, target: dest.target, at });
      }
    }
    state.events.unshift(ev);
  }
  state.selectedId = state.events[0].id;
}

const byId = id => state.events.find(e => e.id === id);
function findDelivery(did) { for (const ev of state.events) { const d = ev.deliveries.find(x => x.id === did); if (d) return [ev, d]; } return null; }
function eventStatus(ev) {
  const s = ev.deliveries.map(d => d.status);
  if (s.includes('DeadLettered')) return 'DeadLettered';
  if (s.includes('Retrying')) return 'Retrying';
  if (s.includes('Pending')) return 'Pending';
  return 'Delivered';
}
const nextIn = d => d.nextAt ? Math.max(0, Math.ceil((d.nextAt - Date.now()) / 1000)) : 0;
const attemptNo = d => d.attempts.length - d.runStart + 1;
const destLabel = key => `${DEST[key].name} ${DEST[key].target}`;
function deadList() { const out = []; for (const ev of state.events) for (const d of ev.deliveries) if (d.status === 'DeadLettered') out.push([ev, d]); return out; }
function stats() {
  const day = Date.now() - 864e5;
  let delivered = 0, retrying = 0, dead = 0, msSum = 0, msN = 0;
  for (const ev of state.events) for (const d of ev.deliveries) {
    if (d.status === 'Delivered') { delivered++; msSum += d.attempts[d.attempts.length - 1].ms; msN++; }
    else if (d.status === 'Retrying') retrying++;
    else if (d.status === 'DeadLettered') dead++;
  }
  return { received: state.events.filter(e => e.receivedAt > day).length, delivered, retrying, dead, avg: msN ? Math.round(msSum / msN) : 0 };
}

/* ---------- engine ---------- */
function simulate(ch) {
  const list = POOL[ch];
  const [name, handle, text] = list[state.simIdx[ch] % list.length];
  state.simIdx[ch]++;
  return ingest(ch, { name, handle }, text);
}
function ingest(channel, from, text) {
  const now = Date.now();
  state.simLog = state.simLog.filter(t => now - t < 60000);
  if (state.simLog.length >= 10) { toast('bad', '429 Too Many Requests', 'The public demo allows 10 test messages per minute. Wait a moment and try again.'); return null; }
  state.simLog.push(now);
  const ev = makeEvent(channel, from, text, now);

}
function setStage(run, i, note) {

}
async function animateIngest(ev) {
  const epoch = state.epoch;

  const n = ev.deliveries.length;
  const notes = [
    `signature ✓ · 202 in ${ev.trace.api} ms`,
    'enqueued to “incoming”',
    `normalized · ${n} route${n > 1 ? 's' : ''}`,
    `dbo.Events #${ev.id} saved`,
    `pushed in ${ev.trace.sr} ms`,
  ];
  for (let i = 0; i < 4; i++) {
    if (epoch !== state.epoch) return;
    setStage(run, i, notes[i]);
    await sleep(reduced ? 220 : 430);
  }
  if (epoch !== state.epoch) return;
  ev.insertedAt = Date.now();
  state.events.unshift(ev);
  state.selectedId = ev.id;

  toast('info', `New ${CH[ev.channel].label} message`, `${ev.from.name}: ${trunc(ev.text, 70)}`);
  tourDone(2);
  await sleep(reduced ? 200 : 380);

}
async function runDelivery(ev, d, replay) {
  const epoch = state.epoch;
  const dest = DEST[d.dest];
  d.runStart = d.attempts.length; d.status = 'Pending'; d.nextAt = null;
  refresh();
  let retry = 0;
  for (;;) {
    await sleep(380);
    if (epoch !== state.epoch) return false;
    const fail = dest.kind === 'discord' && state.outage;
    const ms = fail ? rnd(180, 340) : rnd(120, 290);
    d.attempts.push({ no: d.attempts.length + 1, at: Date.now(), ms, http: fail ? 503 : dest.http, error: fail ? '503 Service Unavailable' : null, replay: !!replay });
    if (!fail) {

      if (dest.kind === 'discord') { state.discord.unshift({ ev, target: dest.target, at: Date.now() }); state.discord.length = Math.min(state.discord.length, 20); }
      refresh();
      return true;

      d.status = 'DeadLettered'; d.nextAt = null;
      refresh();

  });

}

    return { headers: ['POST /api/v1/hooks/stripe HTTP/1.1', 'Content-Type: application/json', `Stripe-Signature: t=${ts},v1=${ev.sig.slice(0, 20)}…`], body: { id: ev.externalId, object: 'event', type: 'payment_intent.succeeded', created: ts, livemode: false, data: { object: { id: 'pi_3Q' + ev.sig.slice(20, 34), object: 'payment_intent', amount: 8640, currency: 'cad', status: 'succeeded', metadata: { orderId: '5521' } } } }, verify: 'Stripe signature valid, timestamp within 5 minutes' };
  }
  const headers = [`POST ${CH[ch].hook} HTTP/1.1`, 'Content-Type: application/json', `X-Hub-Signature-256: sha256=${ev.sig.slice(0, 20)}…`];
  const verify = 'HMAC-SHA256 of the raw body matches the app secret (constant-time compare)';
  let body;
  if (ch === 'instagram') body = { object: 'instagram', entry: [{ id: '17841405822304914', time: ts, messaging: [{ sender: { id: digitsFrom(ev.sig, 16) }, recipient: { id: '17841405822304914' }, timestamp: ev.receivedAt, message: { mid: ev.externalId, text: ev.text } }] }] };
  else if (ch === 'facebook') body = { object: 'page', entry: [{ id: '108512340096711', time: ev.receivedAt, messaging: [{ sender: { id: digitsFrom(ev.sig, 16) }, recipient: { id: '108512340096711' }, timestamp: ev.receivedAt, message: { mid: ev.externalId, text: ev.text } }] }] };
  else body = { object: 'whatsapp_business_account', entry: [{ id: '102290129340398', changes: [{ field: 'messages', value: { messaging_product: 'whatsapp', metadata: { display_phone_number: '15550783881', phone_number_id: '106540352242922' }, contacts: [{ profile: { name: ev.from.name }, wa_id: phone }], messages: [{ from: phone, id: ev.externalId, timestamp: String(ts), type: 'text', text: { body: ev.text } }] } }] }] };
  return { headers, body, verify };
}
function payloadTab(ev) {
  const r = rawRequest(ev);
  const row = { id: ev.id, workspaceId: 2, sourceId: SOURCE_ID[ev.channel], externalId: ev.externalId, channel: ev.channel, senderName: ev.from.name, senderHandle: ev.from.handle, text: ev.text, receivedAt: iso(ev.receivedAt), correlationId: ev.correlationId };
  return `<div class="codeblock"><div class="cb-head"><span>1 · Webhook as received</span><span class="ok-t">verified</span></div><pre>${r.headers.map(h => `<span class="j-c">${esc(h)}</span>`).join('\n')}\n\n${hl(r.body)}</pre><div class="cb-foot"><span class="ok-t">✓ ${esc(r.verify)}</span><span>→ 202 Accepted in ${ev.trace.api} ms, queued to “incoming”</span></div></div>
    <div class="codeblock"><div class="cb-head"><span>2 · Saved to Azure SQL · dbo.Events</span><span>EF Core</span></div><pre>${hl(row)}</pre><div class="cb-foot"><span>Unique index on (SourceId, ExternalId): if the platform sends the same webhook twice, the second insert is skipped.</span></div></div>`;
}
function traceTab(ev) {
  const t = ev.trace, rows = [];
  rows.push({ lb: `POST ${CH[ev.channel].hook}`, svc: 'relayhub-api · App Service', c: 'compute', s: 0, d: t.api });
  rows.push({ lb: 'queue wait · incoming', svc: 'Storage Queue', c: 'data', s: t.api, d: t.q1 });
  const w = t.api + t.q1;
  rows.push({ lb: 'ProcessIncomingEvent', svc: 'relayhub-worker · Functions', c: 'compute', s: w, d: t.fn });
  rows.push({ lb: 'INSERT dbo.Events', svc: 'Azure SQL', c: 'data', s: w + 6, d: t.sql, child: 1 });
  rows.push({ lb: 'SignalR SendToGroup', svc: 'Azure SignalR', c: 'data', s: w + 10 + t.sql, d: t.sr, child: 1 });
  const q2 = w + t.fn;
  rows.push({ lb: 'queue wait · deliveries', svc: 'Storage Queue', c: 'data', s: q2, d: t.q2 });
  const ds = q2 + t.q2;
  ev.deliveries.forEach(d => {
    const a = d.attempts[0];
    if (!a) return;
    rows.push({ lb: `Deliver → ${destLabel(d.dest)}`, svc: 'relayhub-worker · Functions', c: 'compute', s: ds, d: a.ms + 22 });
    rows.push({ lb: `POST ${DEST[d.dest].host}`, svc: `HTTP ${a.http}`, c: a.error ? 'ext fail' : 'ext', s: ds + 11, d: a.ms, child: 1 });
  });
  const total = Math.max(...rows.map(r => r.s + r.d));
  const pct = v => (v / total * 100).toFixed(2);
  const later = [];
  ev.deliveries.forEach(d => d.attempts.slice(1).forEach(a => later.push(`attempt ${a.no} to ${DEST[d.dest].name} → ${a.http}`)));
  return `<div class="legend"><span><i class="svc-compute"></i>Compute: App Service, Functions</span><span><i class="svc-data"></i>Data and messaging</span><span><i class="svc-ext"></i>Outbound call</span></div>
    <div class="wf-wrap"><div class="wf">${rows.map(r => `<div class="wf-row${r.child ? ' child' : ''}"><span class="lb" title="${esc(r.lb)}">${esc(r.lb)}<small>${esc(r.svc)}</small></span><span class="wf-track"><span class="wf-bar svc-${r.c}" style="left:${pct(r.s)}%;width:${Math.max(+pct(r.d), 0.8)}%"></span></span><span class="ms num">${r.d} ms</span></div>`).join('')}
      <div class="wf-axis"><span></span><span class="ax"><span>0 ms</span><span>${Math.round(total / 2)} ms</span><span>${total} ms</span></span><span></span></div></div></div>
    ${later.length ? `<p class="policy">Retries continue the same trace as later spans (not drawn to scale): ${later.join(' · ')}.</p>` : ''}
    <div class="kv"><span>traceparent</span><code>00-${ev.traceId}-${ev.spanId}-01</code><button class="btn btn-sm btn-quiet" data-act="copy" data-copy="${ev.traceId}" data-fid="copy-trace">Copy trace ID</button></div>
    <p class="policy">The worker reads the W3C trace context from the queue message, so Application Insights joins the API, the queue, the worker and the outbound call into one end-to-end trace.</p>`;
}

  ban.innerHTML = state.outage
    ? '<div class="banner"><div><b>The simulated Discord outage is still on.</b> Replays to Discord will fail again until you switch it off.</div><button class="btn btn-sm" data-act="outage-off" data-fid="outage-off">Switch outage off</button></div>'

  el.innerHTML = items.length
    ? `<div class="table-wrap"><table><thead><tr><th>Message</th><th>Destination</th><th>Last error</th><th>Attempts</th><th>Failed</th><th><span class="sr">Action</span></th></tr></thead><tbody>${items.map(([ev, d]) => {
        const last = d.attempts[d.attempts.length - 1];
        return `<tr><td><button class="link-row" data-act="open" data-id="${ev.id}">${glyph(ev.channel)}<span><b>#${ev.id} · ${esc(ev.from.name)}</b><span class="muted">${esc(trunc(ev.text, 64))}</span></span></button></td><td>${DEST[d.dest].name} <span class="mono muted">${esc(DEST[d.dest].target)}</span></td><td class="mono bad-c">${esc(d.lastError || '')}</td><td class="num">${d.attempts.length}</td><td>${ago(last.at)}</td><td><button class="btn btn-sm btn-primary" data-act="replay" data-did="${d.id}" data-fid="replay-${d.id}">Replay</button></td></tr>`;
      }).join('')}</tbody></table></div>`
    : '<div class="empty-card"><b>No dead letters right now.</b><p>To make one, switch on <b>Simulate Discord outage</b> in the Inbox and send a message. After 4 failed attempts it lands here.</p><button class="btn btn-sm" data-act="nav" data-page="inbox">Go to Inbox</button></div>';
  hist.innerHTML = state.replayLog.length
    ? `<section class="sec"><h2 class="h2">Replay history</h2><ul class="hist">${state.replayLog.map(r => {
        const f = findDelivery(r.did);
        if (!f) return '';
        const [ev, d] = f;
        return `<li>${glyph(ev.channel)}<span><b>#${ev.id} → ${esc(destLabel(d.dest))}</b><span class="muted">replayed ${ago(r.at)}</span></span>${deliveryPill(d)}</li>`;
      }).join('')}</ul></section>` : '';
}

/* api console */
const BEARER = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiRGVtbyJ9.k3Jb…';
function apiEvent(ev, detail) {
  const o = { id: ev.id, channel: ev.channel, from: { name: ev.from.name, handle: ev.from.handle }, text: ev.text, receivedAt: iso(ev.receivedAt), status: eventStatus(ev) };
  if (detail) o.correlationId = ev.correlationId;
  o.deliveries = ev.deliveries.map(d => {
    const x = { id: d.id, destination: destLabel(d.dest), status: d.status, attempts: d.attempts.length };
    if (d.lastError && d.status !== 'Delivered') x.lastError = d.lastError;
    if (detail) x.history = d.attempts.map(a => ({ attempt: a.no, at: iso(a.at), httpStatus: a.http, durationMs: a.ms }));
    return x;
  });
  return o;
}
const problem = (status, title, detail, type) => ({ type, title, status, detail, traceId: `00-${hex(32)}-${hex(16)}-01` });
function replayTarget() { const dl = deadList(); return dl.length ? dl[0][1].id : state.events[0].deliveries[0].id; }
const currentEvent = () => byId(state.selectedId) || state.events[0];
const API = [
  { m: 'GET', d: 'List messages that need attention', path: () => '/api/v1/events?status=DeadLettered&take=20',
    run: () => { const items = state.events.filter(e => eventStatus(e) === 'DeadLettered').map(e => apiEvent(e, false)); return [200, { items, total: items.length, nextCursor: null }]; } },
  { m: 'GET', d: 'One message with every delivery attempt', path: () => `/api/v1/events/${currentEvent().id}`,
    run: () => [200, apiEvent(currentEvent(), true)] },
  { m: 'POST', d: 'Replay a dead-lettered delivery', path: () => `/api/v1/deliveries/${replayTarget()}/replay`,
    run: path => {
      const did = +path.split('/')[4];
      const f = findDelivery(did);
      if (f && replay(did)) return [202, { deliveryId: did, eventId: f[0].id, status: 'Pending', message: 'Replay queued' }];
      return [409, problem(409, 'Nothing to replay', `Delivery ${did} is ${f ? f[1].status : 'unknown'}, not DeadLettered.`, 'https://tools.ietf.org/html/rfc9110#section-15.5.10')];
    } },
  { m: 'GET', d: 'Counters for the dashboard', path: () => '/api/v1/stats/summary',
    run: () => { const s = stats(); const byChannel = {}; Object.keys(CH).forEach(c => { byChannel[c] = state.events.filter(e => e.channel === c).length; }); return [200, { window: '24h', received: s.received, delivered: s.delivered, retrying: s.retrying, deadLettered: s.dead, avgDeliveryMs: s.avg, byChannel }]; } },
  { m: 'POST', d: 'Simulate a signed WhatsApp webhook', path: () => '/api/v1/demo/simulate', body: () => ({ channel: 'whatsapp' }),
    run: () => { const ev = simulate('whatsapp'); return ev ? [202, { status: 'accepted', eventId: ev.id, correlationId: ev.correlationId }] : [429, problem(429, 'Too Many Requests', 'The demo allows 10 simulated messages per minute.', 'https://tools.ietf.org/html/rfc6585#section-4')]; } },
  { m: 'PUT', d: 'Turn the Discord outage on or off', path: () => '/api/v1/demo/failure-mode', body: () => ({ enabled: !state.outage }),
    run: (path, body) => { setOutage(body.enabled); return [200, { destination: 'Discord #orders', enabled: body.enabled }]; } },
];
function renderApi() {
  const list = $('#api-list'), con = $('#api-console');
  if (!list) return;
  list.innerHTML = API.map((e, i) => `<li><button class="ep" data-act="api" data-i="${i}" data-fid="ep-${i}" aria-current="${i === state.apiSel}"><span class="m m-${e.m}">${e.m}</span><span class="p">${esc(e.path().split('?')[0])}</span><span class="d">${e.d}</span></button></li>`).join('');
  const e = API[state.apiSel];
  const out = state.apiOut && state.apiOut.i === state.apiSel ? state.apiOut : null;
  const path = out ? out.path : e.path();
  const body = out ? out.body : e.body && e.body();
  const req = [`${e.m} ${path} HTTP/1.1`, `Authorization: Bearer ${BEARER}`, 'Accept: application/json'].concat(body ? ['Content-Type: application/json'] : []);
  const resHead = out ? `HTTP/1.1 ${out.status} ${HTTP_TEXT[out.status]}` : '';
  con.innerHTML = `<div class="codeblock"><div class="cb-head"><span>Request</span><button class="btn btn-sm btn-primary" data-act="api-send" data-fid="api-send">Send request</button></div><pre>${req.map(l => `<span class="j-c">${esc(l)}</span>`).join('\n')}${body ? '\n\n' + hl(body) : ''}</pre></div>
    <div class="codeblock"><div class="cb-head"><span>Response</span>${out ? `<span class="${out.status < 300 ? 'ok-t' : 'bad-t'}">${out.status} ${HTTP_TEXT[out.status]} · ${out.ms} ms</span>` : ''}</div><pre>${out
      ? `<span class="${out.status < 300 ? 'ok-t' : 'bad-t'}">${resHead}</span>\n<span class="j-c">Content-Type: application/${out.status >= 400 ? 'problem+' : ''}json; charset=utf-8\nX-Correlation-Id: ${out.corr}</span>\n\n${hl(out.res)}`
      : '<span class="j-c">Press “Send request” to call the mock API.\nIn the real build this goes to ASP.NET Core on Azure App Service.</span>'}</pre></div>`;
}
function apiSend() {
  const e = API[state.apiSel];
  const path = e.path();
  const body = e.body && e.body();
  const [status, res] = e.run(path, body);
  state.apiOut = { i: state.apiSel, path, body, status, res, ms: rnd(16, 58), corr: hex(12) };
  renderApi();
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'demo') { tourDone(1); state.page = 'inbox'; state.view = state.woke ? 'app' : 'waking'; renderScreen(); }
  else if (a === 'skip-wake') { state.wakeToken = null; enterApp(); }
  else if (a === 'scroll') { const t = document.getElementById(b.dataset.target); if (t) t.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' }); }
  else if (a === 'nav') go(b.dataset.page);
  else if (a === 'select') { state.selectedId = +b.dataset.id; state.showDetail = true; refresh(); if (matchMedia('(max-width: 999px)').matches) $('#inbox').scrollIntoView({ block: 'start' }); }
  else if (a === 'back') { state.showDetail = false; refresh(); $('#inbox').scrollIntoView({ block: 'start' }); }
  else if (a === 'tab') { state.tab = b.dataset.tab; refresh(); }
  else if (a === 'filter') { state.filter = b.dataset.f; renderFilters(); renderList(); }
  else if (a === 'sim') simulate(b.dataset.ch);
  else if (a === 'replay') replay(+b.dataset.did);
  else if (a === 'replay-all') deadList().forEach(([, d]) => replay(d.id));
  else if (a === 'outage-off') setOutage(false);
  else if (a === 'open') { state.selectedId = +b.dataset.id; state.tab = 'deliveries'; state.showDetail = true; go('inbox', true); }
  else if (a === 'copy') copyText(b.dataset.copy, b);
  else if (a === 'test-dest') testDest(b.dataset.dest);
  else if (a === 'api') { state.apiSel = +b.dataset.i; renderApi(); }
  else if (a === 'api-send') apiSend();
  else if (a === 'tour') jump(+b.dataset.step);
  else if (a === 'tour-hide') { state.tourHidden = true; renderTour(); }
  else if (a === 'tour-show') { state.tourHidden = false; renderTour(); }
  else if (a === 'reset') resetDemo();
  else if (a === 'exit') { state.view = 'landing'; renderScreen(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'outage' || e.target.id === 'outage-dest') setOutage(e.target.checked);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { state.q = t.value; renderList(); }
  else if (t.id === 'own-text') { const err = $('#own-err'); if (err) err.hidden = true; }
  else if (t.id === 'reply') state.drafts[state.selectedId] = t.value;
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'own-form') {
    const input = $('#own-text');
    const v = input.value.trim();
    if (!v) { $('#own-err').hidden = false; input.focus(); return; }
    if (ingest('form', { name: 'You (demo visitor)', handle: 'visitor@example.com' }, v)) input.value = '';
  } else if (f.dataset.form === 'reply') {
    const id = +f.dataset.id;
    const ev = byId(id);
    const v = (state.drafts[id] || '').trim();
    if (!ev) return;
    if (!v) { toast('warn', 'Nothing to send', 'Type a reply first.'); return; }
    ev.replies.push({ text: v, at: Date.now() });
    state.drafts[id] = '';
    toast('ok', 'Reply sent', `${CH[ev.channel].api} accepted it (mocked in the demo).`);
    refresh();
  }
});

/* ---------- boot ---------- */
seed();
renderScreen();
setInterval(() => {
  $$('[data-next]').forEach(el => {
    const f = findDelivery(+el.dataset.next);
    if (f && f[1].nextAt) { const v = String(nextIn(f[1])); if (el.textContent !== v) el.textContent = v; }
  });
}, 250);
setInterval(() => { if (state.view === 'app' && state.page === 'inbox') renderList(); }, 30000);
})();
