name: Deploy API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'infra/**'
      - '.github/workflows/deploy.yml'

permissions:
  id-token: write   # OIDC token for Azure login
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-relayhub
  DOTNET_VERSION: 10.0.x

jobs:
  deploy:
    name: Infra + API
    runs-on: ubuntu-latest
    environment: production
    # Skips silently until the Azure OIDC variables exist (see infra/README.md).
    if: ${{ vars.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure (idempotent)
        id: infra
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          API_KEY_MASTER_KEY: ${{ secrets.API_KEY_MASTER_KEY }}
          OPS_DISCORD_WEBHOOK_URL: ${{ secrets.OPS_DISCORD_WEBHOOK_URL }}
          # Week 3 — required by infra/main.bicepparam (the Bicep compile fails with "environment variable ... does not exist" otherwise)
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          # Weeks 3/4 — optional; an unset GitHub secret arrives as "" and the Bicep then skips the secret + app setting
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_VERIFY_TOKEN: ${{ secrets.META_VERIFY_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          EMAIL_INBOUND_SECRET: ${{ secrets.EMAIL_INBOUND_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}   # a sender address is not a secret: repo variable
          DEPLOY_SIGNALR: ${{ vars.DEPLOY_SIGNALR }}   # 'true' once Microsoft.SignalRService is registered on the subscription (portal, one click)
        run: |
          out=$(az deployment group create -g "$RESOURCE_GROUP" -f infra/main.bicep -p infra/main.bicepparam --query properties.outputs -o json)
          echo "apiName=$(echo "$out" | jq -r .apiName.value)"           >> "$GITHUB_OUTPUT"
          echo "workerName=$(echo "$out" | jq -r .workerName.value)"     >> "$GITHUB_OUTPUT"
          echo "apiUrl=$(echo "$out" | jq -r .apiUrl.value)"             >> "$GITHUB_OUTPUT"
          echo "sqlFqdn=$(echo "$out" | jq -r .sqlServerFqdn.value)"     >> "$GITHUB_OUTPUT"
          echo "sqlDb=$(echo "$out" | jq -r .sqlDatabaseName.value)"     >> "$GITHUB_OUTPUT"
          echo "sqlServer=$(echo "$out" | jq -r .sqlServerFqdn.value | cut -d. -f1)" >> "$GITHUB_OUTPUT"
          echo "signalRName=$(echo "$out" | jq -r .signalRName.value)"   >> "$GITHUB_OUTPUT"
          echo "swaName=$(echo "$out" | jq -r .staticWebAppName.value)"  >> "$GITHUB_OUTPUT"
          echo "dashboardHostname=$(echo "$out" | jq -r .dashboardHostname.value)" >> "$GITHUB_OUTPUT"
          echo "dashboardUrl=$(echo "$out" | jq -r .dashboardUrl.value)" >> "$GITHUB_OUTPUT"

      - name: Restore, build, publish API + worker
        run: |
          dotnet restore
          dotnet publish src/RelayHub.Api -c Release -o publish/api --no-restore
          dotnet publish src/RelayHub.Worker -c Release -o publish/worker --no-restore

      - name: Build EF Core migration bundle
        run: |
          dotnet tool restore
          dotnet ef migrations bundle -p src/RelayHub.Infrastructure -s src/RelayHub.Api -o publish/efbundle --self-contained -r linux-x64 --force

      - name: Apply migrations (temporary firewall rule for this runner)
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          ip=$(curl -fsS https://api.ipify.org)
          az sql server firewall-rule create -g "$RESOURCE_GROUP" -s "${{ steps.infra.outputs.sqlServer }}" -n "gh-runner-${{ github.run_id }}" --start-ip-address "$ip" --end-ip-address "$ip" -o none
          trap 'az sql server firewall-rule delete -g "$RESOURCE_GROUP" -s "${{ steps.infra.outputs.sqlServer }}" -n "gh-runner-${{ github.run_id }}" -o none' EXIT
          # Serverless SQL may be waking up: retry a few times.
          for i in 1 2 3 4 5 6; do
            publish/efbundle --connection "Server=tcp:${{ steps.infra.outputs.sqlFqdn }},1433;Database=${{ steps.infra.outputs.sqlDb }};User Id=relayhubadmin;Password=$SQL_ADMIN_PASSWORD;Encrypt=True;Connection Timeout=60" && exit 0
            echo "migration attempt $i failed; waiting for the database to resume..."; sleep 20
          done
          exit 1

      # Worker first: once the queue-first API is live, every ingest needs a worker to drain the incoming queue.
      - name: Deploy worker to Functions (Flex Consumption)
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.infra.outputs.workerName }}
          package: publish/worker
          sku: flexconsumption
          remote-build: false

      - name: Deploy package to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.infra.outputs.apiName }}
          package: publish/api

      - name: Smoke check
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "${{ steps.infra.outputs.apiUrl }}/health"; then echo; echo "API is up: ${{ steps.infra.outputs.apiUrl }}"; exit 0; fi
            sleep 15
          done
          echo "API did not answer /health in time"; exit 1

      - name: Worker functions registered
        run: |
          for i in $(seq 1 12); do
            names=$(az functionapp function list -g "$RESOURCE_GROUP" -n "${{ steps.infra.outputs.workerName }}" --query "[].name" -o tsv 2>/dev/null | tr '\n' ' ')
            if echo "$names" | grep -q ProcessIncoming && echo "$names" | grep -q ProcessDelivery; then echo "worker functions: $names"; exit 0; fi
            echo "waiting for the worker to sync its triggers ($names)"; sleep 10
          done
          echo "worker functions did not appear"; exit 1

      # ---- Dashboard (Week 3): build web/ here, upload the static files to the Static Web App with its deployment token ----
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build dashboard
        working-directory: web
        env:
          VITE_API_BASE_URL: ${{ steps.infra.outputs.apiUrl }}   # baked into the bundle at build time (Vite)
        run: |
          npm ci
          npm run build
          test -f dist/index.html
          test -f dist/staticwebapp.config.json || echo "::warning::web/public/staticwebapp.config.json is missing: deep links (/app/inbox) will 404 on Static Web Apps"

      # The token is read from the resource at deploy time, so there is no AZURE_STATIC_WEB_APPS_API_TOKEN secret to keep in sync.
      - name: Static Web App deployment token
        id: swa
        run: |
          token=$(az staticwebapp secrets list -n "${{ steps.infra.outputs.swaName }}" -g "$RESOURCE_GROUP" --query properties.apiKey -o tsv)
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy dashboard to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: web/dist
          output_location: ''
          skip_app_build: true
          skip_api_build: true

      - name: Smoke check dashboard + demo login
        run: |
          url="${{ steps.infra.outputs.dashboardUrl }}"
          code=000
          for i in $(seq 1 12); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$url" || true)
            if [ "$code" = "200" ]; then echo "dashboard is up: $url"; break; fi
            echo "dashboard answered $code; waiting for the upload to propagate"; sleep 10
          done
          [ "$code" = "200" ] || { echo "dashboard did not answer 200 ($code)"; exit 1; }
          # 200 = a demo workspace exists and the demo login works; 503 = no demo workspace yet (Week 5). Anything else is
          # only a warning: the API code for this endpoint may land in a later merge than this workflow.
          demo=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "${{ steps.infra.outputs.apiUrl }}/api/v1/auth/demo" || true)
          echo "POST /api/v1/auth/demo -> HTTP $demo"
          case "$demo" in
            200) echo "demo login works" ;;
            503) echo "demo workspace not available yet (expected until Week 5)" ;;
            *)   echo "::warning::POST /api/v1/auth/demo answered $demo (expected 200 or 503)" ;;
          esac
