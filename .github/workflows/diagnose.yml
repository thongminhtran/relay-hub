name: Diagnose

# Read-only look at the live resources from a machine without `az login` (the Mac): worker state, Key Vault reference
# resolution, queue depths, role assignments, SignalR / Static Web App status, app setting names (never values) and the
# last hour of Application Insights telemetry.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-relayhub

jobs:
  diagnose:
    name: Live status
    runs-on: ubuntu-latest
    environment: production
    if: ${{ vars.AZURE_CLIENT_ID != '' }}
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Worker state, functions, Key Vault references
        run: |
          W=$(az functionapp list -g "$RESOURCE_GROUP" --query "[?contains(name,'worker')].name" -o tsv)
          echo "worker: $W"
          az functionapp show -g "$RESOURCE_GROUP" -n "$W" --query "{state:state, host:defaultHostName, principalId:identity.principalId, runtime:siteConfig.linuxFxVersion}" -o json
          az functionapp function list -g "$RESOURCE_GROUP" -n "$W" --query "[].{name:name, disabled:isDisabled}" -o table
          SUB=$(az account show --query id -o tsv)
          echo "--- Key Vault reference status (worker) ---"
          az rest --method GET --url "https://management.azure.com/subscriptions/$SUB/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.Web/sites/$W/config/configreferences/appsettings?api-version=2022-03-01" -o json \
            | jq -r '.value[] | "\(.name): \(.properties.status) \(.properties.details // "")"'
          API=$(az webapp list -g "$RESOURCE_GROUP" --query "[?contains(name,'api')].name" -o tsv)
          echo "--- Key Vault reference status (api $API) ---"
          az rest --method GET --url "https://management.azure.com/subscriptions/$SUB/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.Web/sites/$API/config/configreferences/appsettings?api-version=2022-03-01" -o json \
            | jq -r '.value[] | "\(.name): \(.properties.status) \(.properties.details // "")"'

      - name: Queue depths
        run: |
          ST=$(az storage account list -g "$RESOURCE_GROUP" --query "[0].name" -o tsv)
          KEY=$(az storage account keys list -g "$RESOURCE_GROUP" -n "$ST" --query "[0].value" -o tsv)
          echo "storage: $ST"
          for q in incoming deliveries incoming-poison deliveries-poison; do
            n=$(az storage queue metadata show --name "$q" --account-name "$ST" --account-key "$KEY" --query approximateMessageCount -o tsv 2>/dev/null || echo "?")
            echo "$q: $n message(s)"
          done

      - name: Role assignments on the storage account
        run: |
          ST=$(az storage account show -g "$RESOURCE_GROUP" -n "$(az storage account list -g "$RESOURCE_GROUP" --query "[0].name" -o tsv)" --query id -o tsv)
          az role assignment list --scope "$ST" --query "[].{role:roleDefinitionName, principal:principalId, type:principalType}" -o table

      - name: SignalR, Static Web App, role assignments on SignalR
        run: |
          S=$(az signalr list -g "$RESOURCE_GROUP" --query "[0].name" -o tsv)
          if [ -z "$S" ]; then echo "no SignalR resource yet (Week 3 Bicep not deployed)"; else
            echo "signalr: $S"
            az signalr show -g "$RESOURCE_GROUP" -n "$S" --query "{state:provisioningState, sku:sku.name, host:hostName, serviceMode:features[?flag=='ServiceMode'].value | [0], cors:cors.allowedOrigins, localAuthDisabled:disableLocalAuth}" -o json
            az role assignment list --scope "$(az signalr show -g "$RESOURCE_GROUP" -n "$S" --query id -o tsv)" --query "[].{role:roleDefinitionName, principal:principalId, type:principalType}" -o table
          fi
          echo "--- Static Web App ---"
          az staticwebapp list -g "$RESOURCE_GROUP" --query "[].{name:name, host:defaultHostname, sku:sku.name, location:location}" -o table
          for h in $(az staticwebapp list -g "$RESOURCE_GROUP" --query "[].defaultHostname" -o tsv); do
            echo "https://$h -> HTTP $(curl -s -o /dev/null -w '%{http_code}' "https://$h")"
          done

      # Names only: a missing setting (e.g. an optional secret that was never set) is visible without exposing any value.
      - name: App setting names (API + worker)
        run: |
          API=$(az webapp list -g "$RESOURCE_GROUP" --query "[?contains(name,'api')].name" -o tsv)
          W=$(az functionapp list -g "$RESOURCE_GROUP" --query "[?contains(name,'worker')].name" -o tsv)
          echo "--- $API ---"
          az webapp config appsettings list -g "$RESOURCE_GROUP" -n "$API" --query "[].name" -o tsv | sort
          echo "--- $W ---"
          az functionapp config appsettings list -g "$RESOURCE_GROUP" -n "$W" --query "[].name" -o tsv | sort

      - name: Application Insights (last 60 min)
        run: |
          az extension add -n application-insights -y >/dev/null 2>&1 || true
          APPI=$(az resource list -g "$RESOURCE_GROUP" --resource-type microsoft.insights/components --query "[0].name" -o tsv)
          echo "app insights: $APPI"
          echo "--- requests / traces / exceptions ---"
          az monitor app-insights query --app "$APPI" -g "$RESOURCE_GROUP" --analytics-query "union requests, traces, exceptions, dependencies | where timestamp > ago(60m) | project timestamp, itemType, role=cloud_RoleName, op=operation_Name, text=coalesce(message, outerMessage, name), sev=severityLevel, ok=success, code=resultCode | order by timestamp desc | take 80" -o table
